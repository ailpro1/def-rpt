name = "insta-report-intake"
main = "src/index.js"
compatibility_date = "2026-01-01"

# Deliberately minimal. There is no R2 bucket, no D1 database and no Durable
# Object here, and none should be added: KV on the free plan covers this
# workload, and enabling R2 requires a payment method on the Cloudflare account.
# Photo bytes live in Telegram, not here.
kv_namespaces = [
  { binding = "BATCHES", id = "REPLACE_WITH_YOUR_KV_ID" },
]

# No [triggers] section, on purpose. This Worker only ever runs when Telegram
# delivers a message or the app asks for a batch — there is no background work
# for a schedule to do. A cron tick used to drive captioning from here; it cost
# a storage allowance every day whether or not anyone used the bot, and it went
# wrong silently because nothing was watching it. Captioning is the app's job
# now, and the schedule went with it.

[vars]
# Comma-separated Telegram chat ids allowed to file photos. Empty means the bot
# accepts nothing, which is the right default for a bot anyone can find.
ALLOWED_CHATS = ""

# Secrets are NOT set here — they would end up in git. Set them with:
#   wrangler secret put TG_TOKEN
#   wrangler secret put TG_WEBHOOK_SECRET
#
# There is no AI key on this Worker. The app holds one Anthropic key and writes
# every caption itself, so there is no second setup to keep in step.
