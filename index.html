<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Insta Report">
<meta name="description" content="Offline-first home building inspection report generator.">
<title>Insta Report</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icons/icon-180.png">
<link rel="icon" href="./icons/icon-192.png">
<link rel="stylesheet" href="./css/app.css">
<link rel="stylesheet" href="./css/report.css">
</head>
<body>
  <div id="app" class="app"></div>

  <nav id="tabbar" class="tabbar" hidden>
    <button class="tab" data-route="#/projects">
      <svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
      <span>Projects</span>
    </button>
    <button class="tab" data-route="#/library">
      <svg viewBox="0 0 24 24"><path d="M4 5h16M4 12h16M4 19h10"/></svg>
      <span>Library</span>
    </button>
    <button class="tab" data-route="#/settings">
      <svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2.2"/><circle cx="10" cy="17" r="2.2"/></svg>
      <span>Settings</span>
    </button>
  </nav>

  <div id="toast" class="toast" hidden></div>
  <div id="sheet-host"></div>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
